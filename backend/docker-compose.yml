version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: verifactu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: verifactu
      POSTGRES_PASSWORD: verifactu
      POSTGRES_DB: verifactu
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: verifactu-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
